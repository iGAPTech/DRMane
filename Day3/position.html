<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        span{
            font-size: 25px;
        }
        .center{
            position: absolute;
            left:45%;
            top:45%;
        }

        .top{
            position: absolute;
            top:0;
            left:45%
        }
        .right{
            position: absolute;
            right:20px;
            top:45%;
        }
        .bottom{
            position: absolute;
            bottom: 0;
            left:45%;
        }
        .left{
            position:absolute;
            top:45%
        }

        .leftTop{
            position: absolute;
            top:0;
            left:0;
        }
        .leftBottom{
            position: absolute;
            bottom:0;
        }

        .rightTop{
            position: absolute;
            right:20px;
            top:0
        }
        .rightBottom{
            position: absolute;
            bottom: 0;
            right: 20px;
        }
    </style>
</head>
<body>
    <span class="center">Center</span>

    <span class="top">Top</span>
    <span class="right">Right</span>
    <span class="bottom">Bottom</span>
    <span class="left">Left</span>

    <span class="leftTop">Left-Top</span>
    <span class="leftBottom">Left-Bottom</span>

    <span class="rightTop">Right-Top</span>
    <span class="rightBottom">Right-Bottom</span>
</body>
</html>
